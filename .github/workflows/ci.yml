name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - name: Install casl-net's dependencies
        working-directory: packages/casl-net
        run: npm ci
      - name: CASL compatibility
        working-directory: tests/casl-compat
        run: |
          npm ci
          npm test
      - run: dotnet pack src/Casl.Net -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
